name: Update baselines

# The Storybook screenshot baselines are Linux ones, compared pixel by pixel by CI. Running `test:update` locally means an
# amd64 Docker run on a Mac (over an hour). This workflow does it on a runner, in the same Playwright image as the CI check
# (keep the tag equal to ci.yml's), and pushes only the changed snapshots to the branch.
#   Actions > Update baselines > Run workflow > branch   (or: gh workflow run update-baselines.yml -f branch=<branch>).
# Manual only, on purpose: a pull-request comment trigger would check out a branch's code in a job holding the App key.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update (never main or production)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-baselines-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  update:
    name: Update the screenshot baselines
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    # SWC refuses to cache its native addon under /github/home: a private cache root (as in ci.yml).
    env: { XDG_CACHE_HOME: /root/.cache }
    steps:
      # An App token (not GITHUB_TOKEN) so the push starts CI on the branch.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - id: target
        env:
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          branch="$INPUT_BRANCH"
          case "$branch" in
            ""|main|production|refs/*|-*|*..*) echo "::error::Refusing branch '$branch'."; exit 1;;
          esac
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.target.outputs.branch }}
          token: ${{ steps.app.outputs.token }} # zizmor: ignore[artipacked] this job pushes the baselines with the app token
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter='@krizaka/storybook^...'
      - run: pnpm --filter storybook storybook:build
      - run: pnpm --filter storybook test:update
      - name: Commit the changed snapshots
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add -A apps/storybook/__screenshots__
          if git diff --cached --quiet; then echo "Baselines already up to date."; exit 0; fi
          git diff --cached --stat | tail -n 40
          export GIT_AUTHOR_NAME='krizaka-agents[bot]' GIT_COMMITTER_NAME='krizaka-agents[bot]'
          export GIT_AUTHOR_EMAIL='krizaka-agents[bot]@users.noreply.github.com' GIT_COMMITTER_EMAIL='krizaka-agents[bot]@users.noreply.github.com'
          git commit -q -m "test(storybook): Linux baselines" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push origin "HEAD:refs/heads/$BRANCH"
