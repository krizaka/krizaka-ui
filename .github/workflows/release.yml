# .github/workflows/release.yml (krizaka-ui)
name: Release
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: write, pull-requests: write, id-token: write }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, registry-url: https://registry.npmjs.org }
      - run: npm install -g npm@11      # trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run check --filter='./packages/*'   # the published packages (the catalogue is checked by CI)
      # changesets/action v2 = Changesets CLI v3 (v1 reads the v3 pre-release folder `.changeset/pre/` as a v1 changeset
      # and fails). Inputs are kebab-case; the token goes through `github-token`.
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish   # → npm publish --provenance ; tags @krizaka/ui@2.0.0, @krizaka/tokens@1.0.0…
          pr-title: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # Brand marks (krizaka-ui#217): the public copies of every logo, at stable URLs on Bunny (brand/<product>/…, brand/index.json),
      # regenerated when this push changes the version of @krizaka/ui (the merge of "chore: version packages", or a publish) or on demand.
      # Needs the repository secrets MEDIA_STORAGE_API_KEY, MEDIA_STORAGE_ZONE (and optionally MEDIA_CDN_HOSTNAME); without them the step says so and is skipped.
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.changesets.outputs.published }}" = "true" ] || ! git diff --quiet HEAD~1 HEAD -- packages/ui/package.json; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Publish the brand marks to Bunny
        if: steps.ver.outputs.changed == 'true'
        env:
          MEDIA_STORAGE_API_KEY: ${{ secrets.MEDIA_STORAGE_API_KEY }}
          MEDIA_STORAGE_ZONE: ${{ secrets.MEDIA_STORAGE_ZONE }}
          MEDIA_CDN_HOSTNAME: ${{ secrets.MEDIA_CDN_HOSTNAME }}
        run: |
          if [ -z "$MEDIA_STORAGE_API_KEY" ] || [ -z "$MEDIA_STORAGE_ZONE" ]; then echo "::warning::MEDIA_STORAGE_API_KEY / MEDIA_STORAGE_ZONE are not set: brand marks not published"; exit 0; fi
          pnpm turbo run build --filter=@krizaka/ui
          node tools/export-brand.mjs --out "$RUNNER_TEMP/brand" --upload
