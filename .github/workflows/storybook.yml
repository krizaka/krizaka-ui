# .github/workflows/storybook.yml (krizaka-ui) — the catalogue, built and tested on every push to main, published on
# GitHub Pages (https://krizaka.github.io/krizaka-ui/latest/), and mirrored on Bunny (https://ui.krizaka.com/latest/
# and /<version>/) for every release of @krizaka/ui.
#
# - push to main → build → pages.
# - tag @krizaka/ui@x.y.z (pushed, or `gh workflow run storybook.yml --ref @krizaka/ui@x.y.z`, which release.yml does
#   after a publish: tags pushed by GITHUB_TOKEN start no workflow) → build → bunny. The github-pages environment
#   refuses tags, so pages is skipped there; bunny downloads the artifact the build job of the same run uploaded.
#   Without the four BUNNY_* secrets, bunny is skipped (bunny-secrets says why).
# - pull request touching the catalogue or this workflow → build (no tests: ci.yml runs them) → bunny-dry-run.
name: Storybook
on:
  push: { branches: [main], tags: ["@krizaka/ui@*"] }
  pull_request:
    paths: [".github/workflows/storybook.yml", "apps/storybook/**"]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: "storybook-${{ github.ref }}", cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble   # same image as CI and the Linux screenshots
    env: { XDG_CACHE_HOME: /root/.cache }     # see ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run storybook:build --filter=@krizaka/storybook   # → apps/storybook/storybook-static (after @krizaka/ui...)
      - if: github.event_name != 'pull_request'
        run: pnpm --filter storybook test   # unit tests + test-runner : a11y + captures dark/light
      - run: |
          mkdir -p site/latest && cp -r apps/storybook/storybook-static/. site/latest/
          cp apps/storybook/site/index.html site/index.html   # the root redirects to latest/
      - uses: actions/upload-pages-artifact@v3   # artifact `github-pages`: a tar of site/
        with: { path: site }
  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
  bunny-secrets:
    if: startsWith(github.ref, 'refs/tags/@krizaka/ui@')
    runs-on: ubuntu-latest
    outputs: { ready: "${{ steps.check.outputs.ready }}" }
    steps:
      - id: check
        env:
          STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
          STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          API_KEY: ${{ secrets.BUNNY_API_KEY }}
          PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
        run: |
          if [ -n "$STORAGE_KEY" ] && [ -n "$STORAGE_ZONE" ] && [ -n "$API_KEY" ] && [ -n "$PULLZONE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::BUNNY_STORAGE_KEY, BUNNY_STORAGE_ZONE, BUNNY_API_KEY or BUNNY_PULLZONE_ID is not set: the ui.krizaka.com mirror is skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
  bunny:
    needs: [build, bunny-secrets]
    if: needs.bunny-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # the upload script only (no install: it has no dependency)
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: github-pages, path: pages }
      - run: mkdir -p site && tar -xf pages/artifact.tar -C site
      - name: Upload to Bunny Storage, sync the cache rules, purge ui.krizaka.com
        env:
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_HOST: ${{ vars.BUNNY_STORAGE_HOST }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
          TAG: ${{ github.ref_name }}
        run: >-
          node apps/storybook/scripts/bunny-upload.mjs --dir site/latest
          --dest latest --dest "${TAG#@krizaka/ui@}" --root site/index.html --rules --purge
  bunny-dry-run:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test apps/storybook/scripts/*.test.mjs
      - uses: actions/download-artifact@v4
        with: { name: github-pages, path: pages }
      - run: mkdir -p site && tar -xf pages/artifact.tar -C site
      - name: What a release would send (no network, no secrets)
        run: >-
          node apps/storybook/scripts/bunny-upload.mjs --dir site/latest
          --dest latest --dest 0.0.0-pr.${{ github.event.pull_request.number }} --root site/index.html --rules --purge --dry-run
