# .github/workflows/storybook.yml (krizaka-ui) — the catalogue, built and tested on every push to main, published on
# GitHub Pages (https://krizaka.github.io/krizaka-ui/latest/). The Bunny mirror (ui.krizaka.com, on release tags)
# comes with its own job later.
name: Storybook
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: "storybook-${{ github.ref }}", cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble   # same image as CI and the Linux screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run storybook:build --filter=storybook   # → apps/storybook/storybook-static (after @krizaka/ui...)
      - run: pnpm --filter storybook test   # test-runner : a11y + captures dark/light
      - run: |
          mkdir -p site/latest && cp -r apps/storybook/storybook-static/. site/latest/
          echo '<meta http-equiv="refresh" content="0; url=latest/">' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  pages:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
