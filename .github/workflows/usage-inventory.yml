name: Usage inventory

# Who uses what of @krizaka/ui (ADR-008 §8.2.3, docs/inventory/ui-usage.{json,md}). Every Monday it shallow-clones the
# consumers, reruns `tools/usage-inventory.mjs`, and, when an entry's users, verdict, status or domain moved, opens a
# pull request with the App identity: a reviewer sees an entry lose its last user. A run that cannot read a consumer
# fails instead of writing a partial inventory. Manual runs: Actions > Usage inventory > Run workflow.
#
# With a `branch` input (gh workflow run usage-inventory.yml -f branch=<branch>) it regenerates the inventory ON that branch,
# pinned (the consumers at the commits the branch's inventory records), and pushes only docs/inventory/ui-usage.{json,md}.
# The merge train dispatches it after it resolved a conflict on those two files by taking main's side (krizaka-agents
# tools/regenerable.json, krizaka-internal#3617). The App key never meets the branch's code: the job runs main's
# generator only (it refuses a branch that changes it), reads the branch's tree as data, installs and runs nothing of it.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose inventory to regenerate (empty = the weekly refresh; never main or production)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: usage-inventory-${{ github.event.inputs.branch || 'weekly' }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the usage inventory
    if: ${{ !inputs.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Two App tokens, each as narrow as its job: one reads every consumer (the paused products are private), one writes this repository.
      - id: read
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: krizaka
          repositories: |-
            verikora
            folioviv
            sovkora
            krizaka-com
            krizaka-blog
            krizaka-java
            krizaka-ts
            krizaka-lab
          permission-contents: read
      - id: write
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the last-change and first-commit dates come from the history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The sizes are measured on the published build: its dist, unpacked where the inventory looks for it.
      - name: Unpack the published dist
        run: |
          npm pack @krizaka/ui@latest --silent --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/krizaka-ui-*.tgz -C packages/ui --strip-components=1 package/dist
      - name: Read the consumers
        env:
          READ_TOKEN: ${{ steps.read.outputs.token }}
        run: |
          echo "::add-mask::$READ_TOKEN"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)"
          cp docs/inventory/ui-usage.json "$RUNNER_TEMP/before.json"
          node tools/usage-inventory.mjs --latest --keep-local
          git config --global --unset-all http.https://github.com/.extraheader
      - name: What moved
        id: moved
        run: |
          shape='[.entries[] | {name, verdict, status, domain, importers, pausedBy}]'
          if [ "$(jq -S "$shape" "$RUNNER_TEMP/before.json")" = "$(jq -S "$shape" docs/inventory/ui-usage.json)" ]; then
            echo "Nothing moved."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          jq -nr --slurpfile a "$RUNNER_TEMP/before.json" --slurpfile b docs/inventory/ui-usage.json '
            ($a[0].entries | map({key: .name, value: .}) | from_entries) as $old
            | $b[0].entries[]
            | select(($old[.name] // {}) as $o | [$o.verdict, $o.status, $o.domain, $o.importers] != [.verdict, .status, .domain, .importers])
            | "- `\(.name)`: \($old[.name].verdict // "new") -> \(.verdict); live importers \(.live)" ' > "$RUNNER_TEMP/moved.md"
          cat "$RUNNER_TEMP/moved.md"
      - name: Open the pull request
        if: steps.moved.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          BRANCH: chore/usage-inventory-refresh
        run: |
          export GIT_AUTHOR_NAME='krizaka-agents[bot]' GIT_COMMITTER_NAME='krizaka-agents[bot]'
          export GIT_AUTHOR_EMAIL='345578919+krizaka-agents[bot]@users.noreply.github.com' GIT_COMMITTER_EMAIL='345578919+krizaka-agents[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add docs/inventory
          git commit -q -m "chore(inventory): weekly usage refresh"
          echo "::add-mask::$GH_TOKEN"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          {
            echo "The weekly rerun of \`tools/usage-inventory.mjs\` (ADR-008 §8.2.3). Entries whose users, verdict, status or domain moved:"
            echo
            cat "$RUNNER_TEMP/moved.md"
            echo
            echo "An entry that lost its last live importer is a candidate to deprecate; one that gained a user may be promoted."
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > "$RUNNER_TEMP/body.md"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --base main --title "chore(inventory): weekly usage refresh" --body-file "$RUNNER_TEMP/body.md"
          fi

  branch:
    name: Regenerate the usage inventory on a branch
    if: ${{ inputs.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: target
        env:
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          branch="$INPUT_BRANCH"
          case "$branch" in
            ""|main|production|refs/*|-*|*..*|*[!A-Za-z0-9._/-]*) echo "::error::Refusing branch '$branch'."; exit 1;;
            *) ;;
          esac
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      # The generator that runs is main's: a branch cannot change the code that holds the read token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          persist-credentials: false
          sparse-checkout: tools/usage-inventory.mjs
          sparse-checkout-cone-mode: false
      # The branch, as data only (registry, exports, stories, history, the inventory's pins): nothing of it is installed or run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ steps.target.outputs.branch }}
          path: branch
          persist-credentials: false
          fetch-depth: 0 # the last-change and first-commit dates come from the history, as on a laptop
      - name: Refuse a branch that changes the generator or bad pins
        run: |
          if ! cmp -s trusted/tools/usage-inventory.mjs branch/tools/usage-inventory.mjs; then
            echo "::error::This branch changes tools/usage-inventory.mjs: regenerate the inventory by hand in its worktree (node tools/usage-inventory.mjs)."
            exit 1
          fi
          # Each pin becomes a git fetch argument: a full sha or nothing.
          bad=$(jq -r '[.consumers[]?, .paused[]?] | map(.sha | select(. != null and (test("^[0-9a-f]{40}$") | not))) | length' branch/docs/inventory/ui-usage.json)
          if [ "$bad" != "0" ]; then echo "::error::ui-usage.json holds $bad pin(s) that are not a full sha."; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Two App tokens, minted only now: one reads the consumers (private), one writes this repository's contents.
      - id: read
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: krizaka
          repositories: |-
            verikora
            folioviv
            sovkora
            krizaka-com
            krizaka-blog
            krizaka-java
            krizaka-ts
            krizaka-lab
          permission-contents: read
      - name: Regenerate, pinned
        working-directory: branch
        env:
          READ_TOKEN: ${{ steps.read.outputs.token }}
        run: |
          echo "::add-mask::$READ_TOKEN"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)"
          node tools/usage-inventory.mjs --keep-local
          git config --global --unset-all http.https://github.com/.extraheader
          node tools/usage-inventory.mjs --check
      - id: write
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      # An App token (not GITHUB_TOKEN) so the push starts CI on the branch. Only the two inventory files are committed.
      - name: Push the regenerated inventory
        working-directory: branch
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          git add docs/inventory/ui-usage.json docs/inventory/ui-usage.md
          if git diff --cached --quiet; then echo "Inventory already up to date."; exit 0; fi
          git diff --cached --stat
          export GIT_AUTHOR_NAME='krizaka-agents[bot]' GIT_COMMITTER_NAME='krizaka-agents[bot]'
          export GIT_AUTHOR_EMAIL='345578919+krizaka-agents[bot]@users.noreply.github.com' GIT_COMMITTER_EMAIL='345578919+krizaka-agents[bot]@users.noreply.github.com'
          git commit -q -m "chore(inventory): regenerate the usage inventory after main was merged in"
          echo "::add-mask::$GH_TOKEN"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin "HEAD:refs/heads/$BRANCH"
