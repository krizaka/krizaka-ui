# The proof that the PUBLISHED packages work: tools/consumer-smoke installs @krizaka/* from npm (never the workspace)
# into throwaway apps and builds them — a Next.js 16 App Router app (`next build`), an Expo SDK 57 app (`tsc` +
# `expo export`), a Node script (@krizaka/realtime, @krizaka/push). Every day, after each release (the tags that
# `changeset publish` pushes, and the Release workflow), and on demand. Not a required check: it tests npm, not the
# branch (a pull request runs it only when the smoke itself changes). A failure is fixed in the package, released,
# and this run goes green again.
name: Consumer smoke

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    tags: ["@krizaka/*@*"]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
  pull_request:
    paths: ["tools/consumer-smoke/**", ".github/workflows/consumer-smoke.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Published packages in a fresh ${{ matrix.consumer }} app
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        consumer: [next, expo, node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # On a release tag (@krizaka/ui@2.11.0), wait until npm serves that version, then test it.
      - name: Install from npm and build
        env:
          CONSUMER: ${{ matrix.consumer }}
          EXPECT: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node tools/consumer-smoke/run.mjs --only "$CONSUMER" ${EXPECT:+--expect "$EXPECT"}
