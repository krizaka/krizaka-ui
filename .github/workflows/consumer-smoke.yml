# The proof that the PUBLISHED packages work: tools/consumer-smoke installs @krizaka/* from npm (never the workspace)
# into throwaway apps and builds them — a Next.js 16 App Router app (`next build`), an Expo SDK 57 app (`tsc` +
# `expo export`), a Node script (@krizaka/realtime, @krizaka/push). Every day, after each release of @krizaka/ui (its
# tag; the other packages are installed at their latest by the same run), and on demand. Not after every push to main
# (a `workflow_run` on Release ran 3 jobs per merge although nothing had been published) and not once per package tag
# (a release pushes several: one run, the others cancelled — CI-COST). Not a required check: it tests npm, not the
# branch (a pull request runs it only when the smoke itself changes). A failure is fixed in the package, released,
# and this run goes green again.
name: Consumer smoke

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    tags: ["@krizaka/ui@*"]
  workflow_dispatch:
  pull_request:
    paths: ["tools/consumer-smoke/**", ".github/workflows/consumer-smoke.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'published' }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Published packages in a fresh ${{ matrix.consumer }} app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        consumer: [next, expo, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # On a release tag (@krizaka/ui@2.11.0), wait until npm serves that version, then test it.
      - name: Install from npm and build
        env:
          CONSUMER: ${{ matrix.consumer }}
          EXPECT: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node tools/consumer-smoke/run.mjs --only "$CONSUMER" ${EXPECT:+--expect "$EXPECT"}
