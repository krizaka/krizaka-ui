# DigitalOcean builds ui.krizaka.com on every push to main (apps/site/deploy/app.yaml): wait until the live site serves this commit
# (/build.json, apps/site/scripts/build-info.mjs), then IndexNow (changed URLs only) and the family's SEO guard on the live host.
# Red opens one issue here (krizaka/.github#438).
name: post-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # run it from main: it waits for that branch's commit

permissions:
  contents: read

concurrency:
  group: post-deploy
  cancel-in-progress: true # a newer push is the build the site will serve: the older wait would only time out

jobs:
  post-deploy:
    permissions:
      contents: read
      issues: write
    uses: krizaka/.github/.github/workflows/post-deploy.yml@eabaefb885a73d7f670b5537cf8b56d8247978e3
    with:
      site-url: https://ui.krizaka.com
      version-url: https://ui.krizaka.com/build.json
      expect: ${{ github.sha }}
      indexnow-key: 175670af188d9ebc0533400594b5f806 # gitleaks:allow — the IndexNow key is public by design (served at /<key>.txt)
      seo-args: "--limit 400"
