# Lint, type-check, test, build, size and publint on every change — one `turbo run check`, cached per package.
# Publishing is not here: release.yml (Changesets) versions, publishes and tags @krizaka/<pkg>@x.y.z.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Docs-only pull requests (root markdown, docs/, changesets, workflows other than this one) skip the heavy jobs below.
    # A skipped job reports « Skipped », which keeps the required checks satisfied; the gate fails open (krizaka/.github changes.yml).
    uses: krizaka/.github/.github/workflows/changes.yml@ccd224612f5bb9db815335654f359a595a597fbb # main
    with:
      ignore: '^[^/]+\.md$|^LICENSE|^docs/|^\.changeset/|^\.github/(?!workflows/ci\.yml$)'

  check:
    # The job name is the required status check on main: keep it.
    name: Type-check, test, build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The Storybook screenshots are compared pixel by pixel: run in the Playwright image the Linux baselines were made
    # in (same fonts, same Chromium). Keep the tag equal to the `playwright` version of apps/storybook.
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    # SWC (the test-runner's transform) refuses to cache its native addon under /github/home (writable by others): a private cache root.
    env: { XDG_CACHE_HOME: /root/.cache }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the affected-packages filter diffs against the base branch
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo's cache: a task whose inputs (its files + its dependencies') are unchanged replays instead of running, so a
      # pull request that touches one package re-runs that package and what depends on it — not the 91 tasks and the
      # Storybook screenshots. A cache hit is a task that already passed on identical inputs; a miss runs it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-check-${{ github.sha }}
          restore-keys: turbo-check-
      # Pull requests check the packages the change touches (and what depends on them); main and manual runs check everything.
      - name: Select the packages to check
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git diff --name-only -z "origin/$GITHUB_BASE_REF...HEAD" | node tools/ci-filter.mjs "$GITHUB_BASE_REF" >> "$GITHUB_ENV"
          else
            echo "TURBO_FILTER=*" >> "$GITHUB_ENV"
          fi
      # Fail fast: lint and types first (cheap), tests, build and stories after; `check` below replays these from the cache.
      - run: pnpm turbo run lint typecheck --filter="$TURBO_FILTER" --filter='!@krizaka/site'
      - run: pnpm turbo run check --filter="$TURBO_FILTER" --filter='!@krizaka/site'   # the documentation site has its own job (below)
      - run: pnpm test:tools   # tools/ (the inventory): node:test, no build
      - name: Upload the screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook-screenshot-diffs
          path: apps/storybook/__screenshots__/__diff__
          if-no-files-found: ignore

  site:
    # ui.krizaka.com (apps/site), built from the packages of this commit: lint (with gen-ui-docs --check), types, tests
    # (the IA, the URL map, the registries' completeness) and the static export. Deployed by DigitalOcean on push to main.
    name: Documentation site - build, lint, types, tests, SEO
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo's cache: a task whose inputs (its files + its dependencies') are unchanged replays instead of running, so a
      # pull request that touches one package re-runs that package and what depends on it — not the 91 tasks and the
      # Storybook screenshots. A cache hit is a task that already passed on identical inputs; a miss runs it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-site-${{ github.sha }}
          restore-keys: turbo-site-
      # The declaration bundler of @krizaka/ui (tsup dts worker) outgrew the default heap with the number of entries.
      - run: pnpm turbo run build --filter=@krizaka/site...
        env: { NODE_OPTIONS: --max-old-space-size=6144 }
      - run: pnpm turbo run lint typecheck test --filter=@krizaka/site
      - name: The family SEO contract on the export (krizaka-com AGENTS.md §2.4)
        run: |
          python3 -m http.server 4600 -d apps/site/out >/dev/null 2>&1 &
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:4600/ && break; sleep 0.5; done
          node apps/site/scripts/check-seo-family.mjs --base http://localhost:4600 --host https://ui.krizaka.com --limit 400
      - name: Keep the export for the browser checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site-out
          path: apps/site/out
          retention-days: 1


  site-docs-crawl:
    # The documentation crawl, in three slices side by side (the crawl is the longest step: 8 minutes in one piece).
    name: ${{ format('Documentation crawl {0}/3', matrix.shard) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    needs: [changes, site]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.site.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      # Only what the browser checks need: Playwright (storybook's pinned copy) and the scripts' own dependencies.
      - run: pnpm install --frozen-lockfile --prefer-offline --filter @krizaka/storybook
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-out
          path: apps/site/out
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/storybook/package.json') }}   # follows apps/storybook's pinned playwright, not every lockfile change
      - run: pnpm --filter @krizaka/storybook exec playwright install --with-deps chromium
      - name: Every example of a sample of pages (slice ${{ matrix.shard }}/3), driven in a browser (apps/site/scripts/docs-crawl.mjs; the full crawl is docs-crawl.yml)
        # Opens the pages like a reader: console and React errors, failed requests, examples that render nothing, playground
        # controls that change nothing, copy buttons that copy nothing, dead links and anchors, a page that scrolls sideways,
        # an example that throws on click or focus. Every page that is not a component page, and 24 component pages (120, both
        # languages, after a merge to main).
        run: |
          curl -fsS -o /dev/null http://localhost:4600/ || { python3 -m http.server 4600 -d apps/site/out >/dev/null 2>&1 & sleep 2; }
          node apps/site/scripts/docs-crawl.mjs --base http://localhost:4600 --playwright "$(cd apps/storybook && node -p 'require.resolve("playwright")')" ${{ github.event_name == 'pull_request' && '--subset 24 --lang en' || '--subset 120' }} --shard ${{ matrix.shard }}/3 --no-external --concurrency 3 --out docs-crawl-report
      - name: The crawler finds what it promises (pages made to be wrong)
        run: node apps/site/scripts/docs-crawl.selftest.mjs --playwright "$(cd apps/storybook && node -p 'require.resolve("playwright")')"
      - name: Upload the documentation crawl report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-crawl-report-${{ matrix.shard }}
          path: docs-crawl-report
          if-no-files-found: ignore

  site-layout:
    # The look of the top pages, the home's geometry and the motion check: one serial leg beside the crawl slices.
    name: Documentation site - layout and motion
    needs: [changes, site]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.site.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      # Only what the browser checks need: Playwright (storybook's pinned copy) and the scripts' own dependencies.
      - run: pnpm install --frozen-lockfile --prefer-offline --filter @krizaka/storybook
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-out
          path: apps/site/out
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/storybook/package.json') }}   # follows apps/storybook's pinned playwright, not every lockfile change
      - run: pnpm --filter @krizaka/storybook exec playwright install --with-deps chromium
      - name: The look of the top pages in a browser (desktop + phone, dark + light)
        run: |
          pnpm --filter @krizaka/storybook exec playwright install --with-deps chromium
          curl -fsS -o /dev/null http://localhost:4600/ || { python3 -m http.server 4600 -d apps/site/out >/dev/null 2>&1 & sleep 2; }
          node apps/site/scripts/crawl-check.mjs --base http://localhost:4600 --playwright "$(cd apps/storybook && node -p 'require.resolve("playwright")')"
      - name: The home's showcase geometry (the clip fills its tile, plans, chat, progress, nothing cut)
        run: |
          curl -fsS -o /dev/null http://localhost:4600/ || { python3 -m http.server 4600 -d apps/site/out >/dev/null 2>&1 & sleep 2; }
          node apps/site/scripts/home-geometry.mjs --base http://localhost:4600 --playwright "$(cd apps/storybook && node -p 'require.resolve("playwright")')"
      - name: The flock moves with motion allowed and is still under reduced motion
        run: |
          curl -fsS -o /dev/null http://localhost:4600/ || { python3 -m http.server 4600 -d apps/site/out >/dev/null 2>&1 & sleep 2; }
          node apps/site/scripts/motion-check.mjs --base http://localhost:4600 --playwright "$(cd apps/storybook && node -p 'require.resolve("playwright")')"

  site-gate:
    # The required check keeps its name « Documentation site (ui.krizaka.com) » (branch protection). Green when the build job and
    # every browser job succeeded; skipped (which passes) when the changes gate said the change needs none of them.
    name: Documentation site (ui.krizaka.com)
    needs: [changes, site, site-docs-crawl, site-layout]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      RESULTS: ${{ needs.site.result }} ${{ needs.site-docs-crawl.result }} ${{ needs.site-layout.result }}
    steps:
      - run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::$r"; exit 1; }; done

  duplication:
    # No copy-pasted code (org rule 2026-10-22): jscpd with the shared thresholds; the duplicated lines of dup-ratchet.json may only go down.
    name: Duplicate code
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22 }
      - uses: krizaka/.github/actions/dup-check@1d506b702a30ad519ca2561b51bcb981fe680e8e # v1.5.2

  realtime:
    # @krizaka/realtime against real servers: two buses per adapter standing for two app instances (PostgreSQL
    # LISTEN/NOTIFY through pgChannel, Redis protocol on Valkey). Not a required check; it fails the run like any job.
    name: Realtime adapters (PostgreSQL, Valkey)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: rt }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @krizaka/realtime test:integration
        env:
          DATABASE_URL: postgresql://postgres:rt@localhost:5432/postgres
          REALTIME_REDIS_URL: redis://localhost:6379
