# Lint, type-check, test, build, size and publint on every change — one `turbo run check`, cached per package.
# Publishing is not here: release.yml (Changesets) versions, publishes and tags @krizaka/<pkg>@x.y.z.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The job name is the required status check on main: keep it.
    name: Type-check, test, build
    runs-on: ubuntu-latest
    # The Storybook screenshots are compared pixel by pixel: run in the Playwright image the Linux baselines were made
    # in (same fonts, same Chromium). Keep the tag equal to the `playwright` version of apps/storybook.
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    # SWC (the test-runner's transform) refuses to cache its native addon under /github/home (writable by others): a private cache root.
    env: { XDG_CACHE_HOME: /root/.cache }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run check --filter='!@krizaka/site'   # the documentation site has its own job (below)
      - run: pnpm test:tools   # tools/ (the inventory): node:test, no build
      - name: Upload the screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook-screenshot-diffs
          path: apps/storybook/__screenshots__/__diff__
          if-no-files-found: ignore

  site:
    # ui.krizaka.com (apps/site), built from the packages of this commit: lint (with gen-ui-docs --check), types, tests
    # (the IA, the URL map, the registries' completeness) and the static export. Deployed by DigitalOcean on push to main.
    name: Documentation site (ui.krizaka.com)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@krizaka/site...
      - run: pnpm turbo run lint typecheck test --filter=@krizaka/site
      - name: The family SEO contract on the export (krizaka-com AGENTS.md §2.4)
        run: |
          python3 -m http.server 4600 -d apps/site/out >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:4600/ && break; sleep 0.5; done
          node apps/site/scripts/check-seo-family.mjs --base http://localhost:4600 --host https://ui.krizaka.com --limit 400
      - name: The look of the top pages in a browser (desktop + phone, dark + light)
        run: |
          pnpm --filter @krizaka/storybook exec playwright install --with-deps chromium
          curl -fsS -o /dev/null http://localhost:4600/ || { python3 -m http.server 4600 -d apps/site/out >/dev/null 2>&1 & sleep 2; }
          node apps/site/scripts/crawl-check.mjs --base http://localhost:4600 --playwright "$(cd apps/storybook && node -p 'require.resolve("playwright")')"
      - name: The home's showcase geometry (the clip fills its tile, plans, chat, progress, nothing cut)
        run: |
          curl -fsS -o /dev/null http://localhost:4600/ || { python3 -m http.server 4600 -d apps/site/out >/dev/null 2>&1 & sleep 2; }
          node apps/site/scripts/home-geometry.mjs --base http://localhost:4600 --playwright "$(cd apps/storybook && node -p 'require.resolve("playwright")')"

  realtime:
    # @krizaka/realtime against real servers: two buses per adapter standing for two app instances (PostgreSQL
    # LISTEN/NOTIFY through pgChannel, Redis protocol on Valkey). Not a required check; it fails the run like any job.
    name: Realtime adapters (PostgreSQL, Valkey)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: rt }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @krizaka/realtime test:integration
        env:
          DATABASE_URL: postgresql://postgres:rt@localhost:5432/postgres
          REALTIME_REDIS_URL: redis://localhost:6379
