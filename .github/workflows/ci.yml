name: CI
on:
  push:
    branches: [feat/terminal-replay]
permissions:
  contents: read
jobs:
  check:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    env: { XDG_CACHE_HOME: /root/.cache }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@krizaka/storybook^... && pnpm --filter storybook storybook:build && pnpm --filter storybook test:update
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-screenshots
          path: apps/storybook/__screenshots__/linux
