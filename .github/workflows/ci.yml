# Lint, type-check, test, build, size and publint on every change — one `turbo run check`, cached per package.
# Publishing is not here: release.yml (Changesets) versions, publishes and tags @krizaka/<pkg>@x.y.z.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The job name is the required status check on main: keep it.
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Storybook test-runner (a11y + dark/light screenshots) is part of `check`: it needs Chromium.
      - run: pnpm --filter storybook exec playwright install --with-deps chromium
      - run: pnpm turbo run check
      - name: Upload the screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-screenshot-diffs
          path: apps/storybook/__screenshots__/__diff__
          if-no-files-found: ignore
