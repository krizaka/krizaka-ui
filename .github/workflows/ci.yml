# Lint, type-check, test, build, size and publint on every change — one `turbo run check`, cached per package.
# Publishing is not here: release.yml (Changesets) versions, publishes and tags @krizaka/<pkg>@x.y.z.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The job name is the required status check on main: keep it.
    name: Type-check, test, build
    runs-on: ubuntu-latest
    # The Storybook screenshots are compared pixel by pixel: run in the Playwright image the Linux baselines were made
    # in (same fonts, same Chromium). Keep the tag equal to the `playwright` version of apps/storybook.
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          ls node_modules/.pnpm | grep swc; node -v; which node; cat /etc/os-release | head -2
          cd apps/storybook && node -e 'try{require(require.resolve("@swc/core",{paths:[require.resolve("@storybook/test-runner")]}));console.log("SWC_OK")}catch(e){console.log(e.cause)}'
      - run: pnpm turbo run check
      - name: Upload the screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-screenshot-diffs
          path: apps/storybook/__screenshots__/__diff__
          if-no-files-found: ignore
