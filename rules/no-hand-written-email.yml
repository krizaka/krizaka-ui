id: no-hand-written-email
language: Tsx
severity: error
message: "No hand-written email (an object or a form with `subject` and `html`). Render a template of `@krizaka/email` and send it with `sendEmail()`: the brand, both languages, the plain-text part, the unsubscribe headers and the escaping come with it."
rule:
  any:
    - kind: object
      all:
        - has:
            kind: pair
            has:
              field: key
              regex: ^["']?html["']?$
        - has:
            kind: pair
            has:
              field: key
              regex: ^["']?subject["']?$
    - pattern: $FORM.append("html", $$$)
    - pattern: $FORM.set("html", $$$)
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.next/**"
  - "packages/email/**"
