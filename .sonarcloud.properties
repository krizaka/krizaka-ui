# SonarCloud automatic analysis — krizaka-ui.
# The components' `meta.ts` files are declarative documentation that follows one schema (ComponentMeta: title, summary,
# whenToUse, accessibility, examples…): SonarCloud counts 139 of the 167 on main as duplicates of each other, so any PR
# adding a component fails the « duplicated lines on new code » condition on data, not code. Copy-pasted code stays
# policed: these files are excluded from copy-paste detection only (every other rule still analyses them), and the
# repository's own jscpd check with its ratchet (dup-ratchet.json, the « Duplicate code » job) still runs on everything.
sonar.cpd.exclusions=packages/*/src/**/meta.ts,packages/*/src/meta/*.ts

# The committed snapshots of @krizaka/email (test/__snapshots__) are the reference output of the templates: email-safe HTML
# (tables with no headers, inline `text-decoration` shorthands, no <title>) that is right for mail clients and wrong for a web
# page. A new template adds four of them; they are test data, not code, so no rule analyses them (the package's own tests do).
sonar.exclusions=packages/email/test/__snapshots__/**
