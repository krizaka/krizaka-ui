<svg width="96" height="96" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><style>
.ymm-orbit { transform-origin: 200px 200px; animation: ymm-orbit 32s linear infinite; }
.ymm-scan { animation: ymm-scan 3.6s cubic-bezier(.45,0,.55,1) infinite; }
.ymm-lens { transform-box: fill-box; transform-origin: center; animation: ymm-lens 3.6s ease-in-out infinite; }
@keyframes ymm-orbit { to { transform: rotate(360deg); } }
@keyframes ymm-scan { 0% { transform: translateY(0); opacity: 0; } 12%, 80% { opacity: 1; } 100% { transform: translateY(192px); opacity: 0; } }
@keyframes ymm-lens {
  0%, 100% { filter: drop-shadow(0 0 6px #6d5ec94d); }
  50% { filter: drop-shadow(0 0 16px #6d5ec999); }
}
@media (prefers-reduced-motion: reduce) { .ymm-orbit, .ymm-scan, .ymm-lens { animation: none; } .ymm-scan { opacity: 0; } }
</style><defs><linearGradient id="ymm-gradient" gradientUnits="userSpaceOnUse" x1="128" y1="300" x2="304" y2="92"><stop offset="0%" stop-color="#5362c6"></stop><stop offset="100%" stop-color="#6d5ec9"></stop></linearGradient><linearGradient id="ymm-core" x1="50%" y1="100%" x2="50%" y2="0%"><stop offset="0%" stop-color="#c9ceff"></stop><stop offset="100%" stop-color="#f4f5ff"></stop></linearGradient><radialGradient id="ymm-glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6d5ec9" stop-opacity="0.18"></stop><stop offset="100%" stop-color="#6d5ec9" stop-opacity="0"></stop></radialGradient><clipPath id="ymm-page"><path d="M128 92 H228 L264 128 V185.87 A52 52 0 1 0 264 278.13 V300 H128 Z"></path></clipPath></defs><circle cx="200" cy="200" r="190" fill="url(#ymm-glow)"></circle><circle cx="200" cy="200" r="134" stroke="var(--kz-border-default, color-mix(in srgb, currentColor 30%, transparent))" stroke-width="1" opacity=".35"></circle><g><circle cx="200" cy="200" r="160" stroke="var(--kz-border-strong, color-mix(in srgb, currentColor 40%, transparent))" stroke-width="1.5" stroke-dasharray="8 8" opacity=".6"></circle><circle cx="200" cy="40" r="9" fill="url(#ymm-gradient)"></circle></g><path d="M128 92 H228 L264 128 V185.87 A52 52 0 1 0 264 278.13 V300 H128 Z" fill="url(#ymm-gradient)"></path><path d="M156 140 H226 M156 170 H236 M156 200 H184 M156 230 H176" stroke="#f4f5ff" stroke-opacity="0.6" stroke-width="10" stroke-linecap="round"></path><path d="M276 268 L304 296" stroke="url(#ymm-gradient)" stroke-width="20" stroke-linecap="round"></path><g><circle cx="240" cy="232" r="40" stroke="url(#ymm-gradient)" stroke-width="12" fill="url(#ymm-core)"></circle><circle cx="230" cy="222" r="8" fill="#ffffff"></circle></g></svg>