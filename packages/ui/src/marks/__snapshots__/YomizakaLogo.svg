  0%, 100% { filter: drop-shadow(0 0 6px #6d5ec94d); opacity: .92; }
  50% { filter: drop-shadow(0 0 16px #6d5ec999); opacity: 1; }
}
@media (prefers-reduced-motion: reduce) { .ymm-orbit, .ymm-core { animation: none; } }
