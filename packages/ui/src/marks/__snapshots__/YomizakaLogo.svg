<svg width="96" height="96" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><style>
.ymm-orbit { transform-origin: 200px 200px; animation: ymm-orbit 32s linear infinite; }
.ymm-core { transform-box: fill-box; transform-origin: center; animation: ymm-core 3.6s ease-in-out infinite; }
@keyframes ymm-orbit { to { transform: rotate(360deg); } }
