sonar.projectKey=krizaka_krizaka-ui
sonar.organization=krizaka
sonar.exclusions=**/node_modules/**,**/dist/**,**/out/**,**/.next/**,**/coverage/**,**/storybook-static/**,**/registry/**,**/__snapshots__/**,**/*.test.*,**/*.spec.*,**/__tests__/**,**/e2e/**,**/src/test/**,**/test/fixtures/**
sonar.javascript.lcov.reportPaths=packages/*/coverage/lcov.info,packages/*/coverage/native/lcov.info,apps/*/coverage/lcov.info
# packages/icons/src/glyphs.ts is GENERATED by packages/icons/scripts/glyphs.mjs (one frozen record per icon, the same shape on every
# line): its « duplication » is data, the generator stays measured (krizaka-internal#2770, Sonar gate of krizaka-ui#972).
sonar.cpd.exclusions=packages/*/src/**/meta.ts,packages/*/src/**/meta/*.ts,packages/*/src/*.meta.ts,docs/inventory/**,packages/icons/src/glyphs.ts

# Test files are tests, not sources: they never count as code to cover (the new-code coverage gate, founder
# decision 9, krizaka-internal#3490) and test rules apply to them. Same patterns are excluded from the sources above.
sonar.tests=.
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/__tests__/**,**/e2e/**,**/src/test/**,**/test/fixtures/**

# Not runtime code, so not measured for coverage: the repository tooling (CI scripts, audits, publishers, brand exporters) and the
# site's build scripts run on a developer or CI machine and ship nowhere; their node:test suites still run in `pnpm test:tools`.
sonar.coverage.exclusions=tools/**,apps/site/scripts/**,apps/storybook/**,**/*.stories.tsx,**/scripts/**,packages/*/tsup.config.ts,**/*.config.*
